[project]
name = "nxopen-journal-toolkit"
version = "1.0.0"
description = "One-command installer for the nxopen-journal skill and nxopen-mcp-enhanced"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "EVOL233awa", email = "89311835+EVOL233awa@users.noreply.github.com" },
]
keywords = ["nxopen", "siemens-nx", "journal", "mcp", "nx12"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.11"
dependencies = [
    "nxopen-mcp-enhanced>=1.0,<2.0",
    "typer>=0.16",
]

[project.urls]
Homepage = "https://github.com/EVOL233awa/nxopen-journal-toolkit"
Repository = "https://github.com/EVOL233awa/nxopen-journal-toolkit"
Issues = "https://github.com/EVOL233awa/nxopen-journal-toolkit/issues"
Changelog = "https://github.com/EVOL233awa/nxopen-journal-toolkit/blob/main/CHANGELOG.md"
Skill = "https://github.com/EVOL233awa/nxopen-journal"

[project.scripts]
nxopen-journal-toolkit = "nxopen_journal_toolkit.cli:app"
nxjt = "nxopen_journal_toolkit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nxopen_journal_toolkit"]

[tool.hatch.build.targets.sdist]
include = [
    "src/nxopen_journal_toolkit",
    "tests",
    "tools",
    "docs",
    "README.md",
    "README.en.md",
    "CHANGELOG.md",
    "LICENSE",
    "NOTICE",
    "LICENSES",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
